<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 19</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./homework-19.js"></script>
  </head>
  <body>
    <div class="app">
      <div class="container">
        <form action="" method="post">
          <label for="name">Enter your name</label>
          <input type="text" name="name" id="name" onfocus="displayInformativeDiv()" onblur="removeInformativeDiv()" required>
          <div class="app-buttons">
            <a href="#" class="button button-enter-link" onclick="getLink(event)">
              <span>Enter link</span>
            </a>
            <a id="transition-via-link" href="#" class="button" target="_blank" onclick="followLink(event)">
              <span>Go to site</span>
            </a>
          </div>
        </form>
        <table></table>
        <div class="image-container"></div>
      </div>
    </div>
  </body>
</html>
