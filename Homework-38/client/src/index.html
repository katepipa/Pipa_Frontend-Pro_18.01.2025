<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css" />
    <title>Online cafe</title>
  </head>
  <body>
    <div class="container text-center">
      <div class="row align-items-start">
        <div class="col-2">
          <!-- Menu -->
          <div
            id="categories-list"
            class="btn-group-vertical"
            role="group"
            aria-label="Vertical button group"
          >
            <button id="menu-burgers" type="button" class="btn btn-danger">
              Burgers
            </button>
            <button id="menu-wraps" type="button" class="btn btn-danger">
              Wraps
            </button>
            <button id="menu-drinks" type="button" class="btn btn-danger">
              Drinks
            </button>
            <button id="menu-orders" type="button" class="btn btn-success">
              My orders
            </button>
          </div>
        </div>
        <div class="col-10">
          <!-- Main section -->
          <div class="products-list">
            <!-- Burgers -->
            <div class="row text-center gx-2 px-4 d-none" id="burgers"></div>
            <!-- Wraps -->
            <div class="row text-center gx-2 px-4 d-none" id="wraps"></div>
            <!-- Drinks -->
            <div class="row text-center gx-2 px-4 d-none" id="drinks"></div>
          </div>
          <!-- Modal order confirm-->
          <div id="product-modal" class="modal d-none">
            <div class="modal-content">
              <span class="close-button">&times;</span>

              <div class="row">
                <div class="col-md-6 text-center">
                  <img id="modal-image" src="" alt="" class="img-fluid mb-2" />
                  <h5 id="modal-title"></h5>
                  <div class="row mt-3 text-md-start">
                    <!-- Calories Column -->
                    <div class="col-6">
                      <p>
                        Base Calories:
                        <span id="modal-base-calories"></span> kcal
                      </p>
                      <p>
                        Final amount of calories:
                        <span id="modal-final-calories">kcal</span> kcal
                      </p>
                    </div>
                    <!-- Prices Column -->
                    <div class="col-6">
                      <p>Base Price: <span id="modal-base-price"></span> EUR</p>
                      <p>
                        Final Price:
                        <span id="modal-final-price">0.00</span> EUR
                      </p>
                    </div>
                  </div>
                </div>

                <div class="col-md-6">
                  <form id="product-form">
                    <div id="options-container"></div>
                    <button
                      id="btn-send-order"
                      type="submit"
                      class="btn btn-success mt-3"
                    >
                      Confirm order
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
          <!-- Container orders -->
          <div class="container d-none" id="container-orders">
            <h2 class="mb-4 text-success">My Orders</h2>
            <div class="row" id="orders-list"></div>
          </div>
        </div>
      </div>
    </div>
    <script src="bundle.js"></script>
  </body>
</html>
