<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 28</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <form id="carForm">
        <h2>Owner Data</h2>
        <label for="ownerName">Name:</label>
        <input type="text" id="ownerName" required /><br />

        <label for="ownerSurname">Surname:</label>
        <input type="text" id="ownerSurname" required /><br />

        <label for="ownerBirthday">Birthday:</label>
        <input type="date" id="ownerBirthday" required /><br /><br />

        <h2>Car Data</h2>
        <label for="brand">Brand:</label>
        <input type="text" id="brand" required /><br />

        <label for="model">Model:</label>
        <input type="text" id="model" required /><br />

        <label for="color">Color:</label>
        <input type="text" id="color" required /><br />

        <label for="state">State:</label>
        <input type="text" id="state" required /><br />

        <label for="bodyType">Body type:</label>
        <input type="text" id="bodyType" required /><br />

        <label for="gearBox">Gear box:</label>
        <input type="text" id="gearBox" required /><br />

        <label for="vinCode">VIN-code:</label>
        <input type="text" id="vinCode" required /><br />

        <label for="year">Year of manufacture:</label>
        <input type="number" id="year" required /><br />

        <label for="price">Price:</label>
        <input type="number" id="price" required /><br />

        <button type="submit">Show info</button>
      </form>
      <div class="car-info"></div>
    </div>
    <script src="./homework-28.js"></script>
  </body>
</html>
