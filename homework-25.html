<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 25</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <aside class="categories">
        <h3>Categories:</h3>
        <div class="categories-nav">
          <ul>
            <li class="categories-item">
              <a href="#" class="categories-link" id="laptops">Mac</a>
            </li>
            <li class="categories-item">
              <a href="#" class="categories-link" id="phones">iPhone</a>
            </li>
            <li class="categories-item">
              <a href="#" class="categories-link" id="earphones">AirPods</a>
            </li>
          </ul>
        </div>
      </aside>
      <main class="products hidden" id="products">
        <h3>List of products:</h3>
        <div class="products-nav">
          <ul class="products-list"></ul>
        </div>
      </main>
      <section class="product-info hidden" id="product-info">
        <h3>Product description:</h3>
        <ul class="product-detailed-info"></ul>
        <button class="product-buy">Buy</button>
        <div class="form-bloc hidden">
          <form action="/server-endpoint" method="get">
            <p class="form-heading">Complete your order:</p>
            <p>
              <label for="name" class="label">Name:</label>
              <input
                type="text"
                id="name"
                name="name"
                maxlength="30"
                required
              />
            </p>
            <p>
              <label for="surname" class="label">Surname:</label>
              <input
                type="text"
                id="surname"
                name="surname"
                maxlength="30"
                required
              />
            </p>
            <p class="select-city">
              <label for="city">Choose your city:</label>
              <select id="city" name="city" required>
                <option value="" selected disabled>---</option>
                <option value="0">Kyiv</option>
                <option value="1">Kharkiv</option>
                <option value="2">Odesa</option>
                <option value="3">Dnipro</option>
                <option value="4">Zaporizhzhia</option>
                <option value="5">Lviv</option>
                <option value="6">Ivano-Frankivsk</option>
                <option value="7">Vinnytsia</option>
                <option value="8">Uzhhorod</option>
                <option value="9">Cherkasy</option>
              </select>
            </p>
            <p class="select-warehouse-Nova-Poshta">
              <label for="warehouse">Nova Poshta warehouse:</label>
              <textarea
                id="warehouse"
                name="warehouse"
                cols="15"
                rows="5"
                required
              ></textarea>
            </p>
            <p>
              <label
                ><input type="radio" name="payment" value="cash" required />
                Postpaid</label
              ><br />
              <label
                ><input type="radio" name="payment" value="card" /> Payment by
                bank card</label
              >
            </p>
            <p>
              <label for="quantity" class="label">Quantity:</label>
              <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                value="1"
              />
            </p>
            <p class="select-order-commentary">
              <label for="commentary">Commentary for the order:</label>
              <textarea
                id="commentary"
                name="commentary"
                cols="15"
                rows="5"
                required
              ></textarea>
            </p>
            <div class="button-block">
              <input type="submit" value="Order" />
            </div>
          </form>
        </div>
      </section>
    </div>
    <script src="./homework-25.js"></script>
  </body>
</html>
