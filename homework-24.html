<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework 24</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="form-block">
        <form action="/server-endpoint" method="get">
          <h1 class="form-heading">Registration</h1>
          <p>
            <label for="name" class="label">Name:</label>
            <input type="text" id="name" name="name" maxlength="30" required />
          </p>
          <p>
            <label for="surname" class="label">Surname:</label>
            <input
              type="text"
              id="surname"
              name="surname"
              maxlength="30"
              required
            />
          </p>
          <p>
            <label for="birthday" class="label">Birthday:</label>
            <input
              type="text"
              id="birthday"
              name="birthday"
              placeholder="dd/mm/yyyy"
              maxlength="10"
              required
            />
          </p>
          <p>
            <input
              type="radio"
              id="gender-male"
              name="gender"
              value="0"
              required
            />
            <label for="gender-male">Man</label>
            <input type="radio" id="gender-female" name="gender" value="1" />
            <label for="gender-female">Woman</label>
          </p>
          <p class="select-city">
            <label for="city">Choose your city:</label>
            <select id="city" name="city" required>
              <option value="" selected disabled>---</option>
              <option value="0">Kyiv</option>
              <option value="1">Kharkiv</option>
              <option value="2">Odesa</option>
              <option value="3">Dnipro</option>
              <option value="4">Zaporizhzhia</option>
              <option value="5">Lviv</option>
              <option value="6">Ivano-Frankivsk</option>
              <option value="7">Vinnytsia</option>
              <option value="8">Uzhhorod</option>
              <option value="9">Cherkasy</option>
            </select>
          </p>
          <p class="select-address">
            <label for="address">Address:</label>
            <textarea
              id="address"
              name="address"
              cols="15"
              rows="5"
              required
            ></textarea>
          </p>
          <div id="languages">
            <label for="language" class="label-language">Languages:</label>
            <br />
            <input
              id="language"
              type="checkbox"
              name="language"
              value="0"
              class="language-ukrainian"
            />
            Ukrainian
            <input type="checkbox" name="language" value="1" /> English
            <input type="checkbox" name="language" value="2" /> German
            <input type="checkbox" name="language" value="3" /> French
            <input type="checkbox" name="language" value="4" /> Spanish
          </div>
          <p>
            <label for="email" class="label">E-mail:</label>
            <input id="email" type="email" name="email" required />
          </p>
          <div class="button-block">
            <input type="submit" value="Submit" />
            <input type="reset" value="Reset" />
          </div>
        </form>
      </div>
    </div>
    <script src="./homework-24.js"></script>
  </body>
</html>
